[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragwire"
version = "1.4.1"
description = "Production-grade RAG toolkit for document ingestion and retrieval with hybrid search support"
readme = "README.md"
license = "MIT"
authors = [
    {name = "KGP Talkie Private Limited", email = "udemy@kgptalkie.com"}
]
maintainers = [
    {name = "KGP Talkie Private Limited", email = "udemy@kgptalkie.com"}
]
keywords = [
    "rag",
    "retrieval",
    "vector-database",
    "qdrant",
    "embeddings",
    "hybrid-search",
    "nlp",
    "document-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    # Core dependencies.
    # langchain-core must be >=1.0: AIMessage.text is a property there, and was
    # a method in 0.3.x, so filter extraction breaks on older releases.
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",

    # Vector database.
    # qdrant-client must be >=1.12 for the facet API used by get_field_values().
    "qdrant-client>=1.12.0,<2.0.0",
    "langchain-qdrant>=1.0.0,<2.0.0",

    # Document processing
    "markitdown[pdf]>=0.1.0,<1.0.0",

    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Data validation
    "pydantic>=2.0.0,<3.0.0",

    # Progress bars
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Provider extras. Floors are set to the first release line that targets
# langchain-core 1.x. Older releases resolve but fail at runtime.

# OpenAI embeddings
openai = [
    "langchain-openai>=1.0.0,<2.0.0",
]

# HuggingFace embeddings
huggingface = [
    "langchain-huggingface>=1.0.0,<2.0.0",
]

# Ollama embeddings
ollama = [
    "langchain-ollama>=1.0.0,<2.0.0",
]

# Google/Gemini embeddings and LLM
google = [
    "langchain-google-genai>=3.0.0,<5.0.0",
]

# FastEmbed for sparse vectors
fastembed = [
    "fastembed>=0.4.0,<1.0.0",
]

# Groq LLM
groq = [
    "langchain-groq>=1.0.0,<2.0.0",
]

# Anthropic LLM
anthropic = [
    "langchain-anthropic>=1.0.0,<2.0.0",
]

# OpenRouter LLM (ChatOpenRouter) + embeddings (official openrouter SDK)
# NOTE: langchain-openrouter requires Python >= 3.10
openrouter = [
    "langchain-openrouter>=0.2.0",
    "openrouter>=0.9.0",
]

# Local cross-encoder reranking. Runs on CPU, needs no API key.
rerank = [
    "sentence-transformers>=3.0.0,<6.0.0",
]

# Hosted reranking via the Cohere Rerank endpoint
cohere = [
    "cohere>=5.0.0,<6.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Required by the aquery/agenerate tests, which are marked asyncio.
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "mkdocs-material>=9.0.0",
]

# All dependencies
all = [
    "ragwire[openai]",
    "ragwire[huggingface]",
    "ragwire[ollama]",
    "ragwire[google]",
    "ragwire[fastembed]",
    "ragwire[groq]",
    "ragwire[anthropic]",
    "ragwire[openrouter]",
    "ragwire[rerank]",
    "ragwire[cohere]",
    "ragwire[dev]",
]

[project.urls]
Homepage = "https://laxmimerit.github.io/RAGWire/"
Documentation = "https://laxmimerit.github.io/RAGWire/"
Repository = "https://github.com/laxmimerit/ragwire.git"
Issues = "https://github.com/laxmimerit/ragwire/issues"
YouTube = "https://youtube.com/kgptalkie"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragwire*"]

[tool.setuptools.package-data]
ragwire = ["py.typed"]

[tool.setuptools.data-files]
"assets" = ["assets/ragwire.png"]

[tool.black]
line-length = 88
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Coverage is opt-in: `pytest --cov=ragwire --cov-report=term-missing`.
# Putting it in addopts makes a plain `pytest` fail unless pytest-cov is installed.
addopts = "-v"
